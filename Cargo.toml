[package]
name = "ethos"
version = "0.2.0"
edition = "2021"
description = "Ethos: A Taint-Tracked Sandbox Runtime and Agent-Computer Interface for AI Agents"
authors = ["Group 2 Nittany Street"]
license = "Unlicense"
default-run = "ethos"

[[bin]]
name = "ethos"
path = "src/bin/ethos.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "tls-rustls"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.2", optional = true }
hmac = "0.12"
aes-gcm = "0.10"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[features]
# Neural "System 1" semantic classifier (BERT-family, pure Rust via candle +
# tokenizers). Opt-in: adds heavy deps; weights load only when
# ETHOS_SEMANTIC_NEURAL is set. Without the flag, SemanticGuard uses the
# deterministic heuristic scorer.
semantic-ml = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
candle-core = ["dep:candle-core"]
candle-nn = ["dep:candle-nn"]
candle-transformers = ["dep:candle-transformers"]
tokenizers = ["dep:tokenizers"]
